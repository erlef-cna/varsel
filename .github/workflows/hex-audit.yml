name: Hex Audit

on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Hex Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: nix develop --no-pure-eval -c bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: mix deps.get
        run: mix deps.get
      - name: mix hex.audit (SARIF)
        # Findings are reported to GitHub and do not fail the build.
        run: mix hex.audit --format sarif --output hex-audit.sarif || true
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: hex-audit.sarif
          category: hex-audit
